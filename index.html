<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Habit Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        h1 { color: #2c3e50; }
        input, button { padding: 10px; margin: 5px; }
        ul { list-style: none; padding: 0; }
        li { margin: 5px 0; }
        .done { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>Habit Tracker</h1>
    <input type="text" id="habitInput" placeholder="Enter a new habit">
    <button onclick="addHabit()">Add Habit</button>
    <ul id="habitList"></ul>

    <script>
        function addHabit() {
            const input = document.getElementById('habitInput');
            const habit = input.value.trim();
            if(habit === '') return;

            const li = document.createElement('li');
            li.textContent = habit;
            li.onclick = () => li.classList.toggle('done'); // click to mark done
            document.getElementById('habitList').appendChild(li);

            input.value = '';
        }
    </script>
</body>
</html>
